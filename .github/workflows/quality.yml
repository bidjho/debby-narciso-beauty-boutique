name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "chore/**"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run automated tests
        run: bun run test
      - name: Lint added test files
        run: bunx eslint src/lib/site-content.test.ts src/lib/team-rules.test.ts --rule 'prettier/prettier: off'
      - name: Build production app
        run: bun run build
